<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CCAT Admin Console</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script>
      // Runtime-configurable Gateway URL (override without a rebuild):
      //   ?gateway=http://host:8080  or  window.__CCAT_GATEWAY__
      window.__CCAT_GATEWAY__ = new URLSearchParams(location.search).get('gateway') || window.__CCAT_GATEWAY__ || 'http://localhost:8080';
      // Theme: the mockup is light-only, so default to LIGHT regardless of OS preference.
      // Only an explicit toggle (persisted here) switches to dark. Set before paint to avoid a flash.
      try { document.documentElement.setAttribute('data-theme', localStorage.getItem('ccat_admin_theme') || 'light'); }
      catch (e) { document.documentElement.setAttribute('data-theme', 'light'); }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
