services:
  - type: web
    name: ccat-gateway
    runtime: docker
    region: singapore
    plan: 0.5c-512mb
    dockerfilePath: ./apps/gateway/Dockerfile
    dockerContext: .
    healthCheckPath: /health/ready
    preDeployCommand: pnpm migrate
    autoDeployTrigger: checksPass
    numInstances: 1
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORAGE_DRIVER
        value: supabase
      - key: SUPABASE_STORAGE_BUCKET
        value: ccat-content
      - key: DATABASE_URL
        sync: false
      - key: MIGRATION_DATABASE_URL
        sync: false
      - key: GATEWAY_HMAC_SECRET
        generateValue: true
      - key: PIN_PEPPER
        sync: false
      - key: GATEWAY_PUBLIC_URL
        sync: false
      - key: ADMIN_WEB_ORIGIN
        sync: false
      - key: WEB_APP_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
